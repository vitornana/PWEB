<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modificador de Texto</title>
    <link rel="stylesheet" href="style.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
</head>
<body>

    <main class="card">
        <h1>Modificador</h1>

        <input type="text" id="entrada" placeholder="Insira seu texto aqui...">

        <select id="acao">
            <option value="" disabled selected>Escolha a conversão</option>
            <option value="upper">Tudo em MAIÚSCULO</option>
            <option value="lower">Tudo em minúsculo</option>
        </select>

        <button id="btnAcao">Converter Texto</button>

        <p id="saida"></p>
    </main>

    <script src="script.js"></script>
</body>
</html>
